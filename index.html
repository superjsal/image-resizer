<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Resizer has moved to jsal.io</title>
<!-- JScale moved to https://jsal.io/image-resizer/. GitHub Pages can't send a server
     redirect, so this page does it: the canonical tag and instant meta refresh tell search
     engines where it lives now, and the script keeps any #fragment (e.g. #about). -->
<link rel="canonical" href="https://jsal.io/image-resizer/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://jsal.io/image-resizer/">
<script>location.replace('https://jsal.io/image-resizer/' + location.search + location.hash);</script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>body { font: 16px/1.5 system-ui, sans-serif; margin: 15vh auto; max-width: 30em; padding: 0 20px; color: #1f1a12; background: #f5efe2; } a { color: #835c0e; }</style>
</head>
<body>
<p>Image Resizer has moved to <a href="https://jsal.io/image-resizer/">jsal.io/image-resizer</a>.</p>
</body>
</html>
